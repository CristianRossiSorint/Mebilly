    <script>
        function toggleMenu() {
            const menu = document.querySelector('.menu');
            menu.classList.toggle('active');
            console.log('Menu toggled:', menu.classList.contains('active'));
        }

        // Chiudi il menu quando clicchi su un link
        document.querySelectorAll('.menu-items-mobile a').forEach(link => {
            link.addEventListener('click', () => {
                document.querySelector('.menu').classList.remove('active');
            });
        });

        // Chiudi il menu quando la finestra si ridimensiona (es. da mobile a desktop)
        window.addEventListener('resize', () => {
            if (window.innerWidth > 1000) {
                document.querySelector('.menu').classList.remove('active');
            }
        });

        // Carosello Thumbnails
        document.addEventListener('DOMContentLoaded', function() {
            const caroselloContainer = document.querySelector('.carosello-container');
            const images = caroselloContainer.querySelectorAll('img');
            const thumbnailsContainer = document.getElementById('thumbnails');

            console.log('Immagini trovate:', images.length);

            images.forEach((img, index) => {
                const thumbnail = document.createElement('div');
                thumbnail.className = 'thumbnail';
                if (index === 0) thumbnail.classList.add('active');

                const thumbImg = document.createElement('img');
                thumbImg.src = img.src;
                thumbImg.alt = `Thumbnail ${index + 1}`;

                thumbnail.appendChild(thumbImg);

                thumbnail.addEventListener('click', function() {
                    // Cambia immagine principale
                    images.forEach(i => i.classList.remove('active'));
                    img.classList.add('active');

                    // Aggiorna thumbnail attivo
                    document.querySelectorAll('.thumbnail').forEach(t => t.classList.remove('active'));
                    thumbnail.classList.add('active');

                    // Scroll smooth al carosello
                    caroselloContainer.scrollIntoView({ behavior: 'smooth', block: 'center' });
                });

                thumbnailsContainer.appendChild(thumbnail);
            });
        });
    </script>
